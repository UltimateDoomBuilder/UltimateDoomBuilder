name: Continuous Integration - Windows

on: [push, pull_request]

jobs:
  build:
    name: "Visual Studio ${{ matrix.platform }} ${{ matrix.configuration }}"
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        #configuration: [Release, Debug]
        configuration: [Release]
        #platform: [x64, x86]
        platform: [x64]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 0 # Required to properly get the commit count

      - name: Get Revision Count
        id: vars
        run: |
          $COUNT=(git rev-list --count HEAD).Trim()
          "REV_COUNT=$COUNT" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Output "Detected Revision: $COUNT"

      - name: Build
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $msbuild = & "$vswhere" -latest -requires Microsoft.Component.MSBuild -find MSBuild\**\Bin\MSBuild.exe | select-object -first 1
          $options = @( `
            '-property:Configuration=${{ matrix.configuration }}', `
            '-property:Platform=${{ matrix.platform }}', `
            '-maxcpucount', `
            '-verbosity:minimal' `
          )
          & $msbuild BuilderRelease.slnf $options
          if (-not $?) { throw "Build failed" }

      - name: Test Files Presence
        run: |
          $files = @( `
            'Build\Builder.exe', `
            'Build\BuilderNative.dll', `
            'Build\Plugins\AutomapMode.dll', `
            'Build\Plugins\BuilderEffects.dll', `
            'Build\Plugins\BuilderModes.dll', `
            'Build\Plugins\ColorPicker.dll', `
            'Build\Plugins\CommentsPanel.dll', `
            'Build\Plugins\NodesViewer.dll', `
            'Build\Plugins\SoundPropagationMode.dll', `
            'Build\Plugins\StairSectorBuilder.dll', `
            'Build\Plugins\TagExplorer.dll', `
            'Build\Plugins\TagRange.dll', `
            'Build\Plugins\ThreeDFloorMode.dll', `
            'Build\Plugins\VisplaneExplorer.dll', `
            'Build\Updater.exe' `
          )
          foreach($file in $files)
          {
            if (!(Test-Path -Path $file -PathType Leaf))
            {
              Write-Output "ERROR: File $file is missing"
              exit 1
            }
          }

      - name: Build Installer
        run: |
          $isccPath = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          
          if (-not (Test-Path $isccPath)) {
              $isccPath = "$env:ProgramFiles\Inno Setup 6\ISCC.exe"
          }

          if (-not (Test-Path $isccPath)) {
              throw "ISCC.exe not found!"
          }

          $outputFileName = "UltimateDoomBuilder-Setup-R${{ env.REV_COUNT }}-${{ matrix.platform }}"

          & $isccPath /DUDB_arch=${{ matrix.platform }} "Setup\UDBuilder_setup.iss" "-f$outputFileName" "/ORelease"
          if (-not $?) { throw "Building installer failed" }

      - name: Upload Package
        uses: actions/upload-artifact@v7
        with:
          path: Release/UltimateDoomBuilder-Setup-R${{ env.REV_COUNT }}-${{ matrix.platform }}.exe
          archive: false
          if-no-files-found: error
          retention-days: 1

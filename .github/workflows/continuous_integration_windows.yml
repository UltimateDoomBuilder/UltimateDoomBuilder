name: Continuous Integration - Windows

on: [push, pull_request]

jobs:
  get-revision:
    name: Get Revision
    runs-on: ubuntu-latest
    outputs:
      revision: ${{ steps.vars.outputs.REV_COUNT }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 0 # Required to properly get the commit count      
      
      - name: Determine Revision
        id: vars
        run: |
          COUNT=$(git rev-list --count HEAD)
          echo "REV_COUNT=$COUNT" >> $GITHUB_OUTPUT
          echo "Detected Revision: $COUNT"   

  build-windows:
    name: "Visual Studio ${{ matrix.platform }} ${{ matrix.configuration }}"
    needs: get-revision
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        #configuration: [Release, Debug]
        configuration: [Release]
        #platform: [x64, x86]
        platform: [x64]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 0 # Required to properly get the commit count

      - name: Build
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $msbuild = & "$vswhere" -latest -requires Microsoft.Component.MSBuild -find MSBuild\**\Bin\MSBuild.exe | select-object -first 1
          $options = @( `
            '-property:Configuration=${{ matrix.configuration }}', `
            '-property:Platform=${{ matrix.platform }}', `
            '-maxcpucount', `
            '-verbosity:minimal' `
          )
          & $msbuild BuilderRelease.slnf $options
          if (-not $?) { throw "Build failed" }

      - name: Test Files Presence
        run: |
          $files = @( `
            'Build\Builder.exe', `
            'Build\BuilderNative.dll', `
            'Build\Plugins\AutomapMode.dll', `
            'Build\Plugins\BuilderEffects.dll', `
            'Build\Plugins\BuilderModes.dll', `
            'Build\Plugins\ColorPicker.dll', `
            'Build\Plugins\CommentsPanel.dll', `
            'Build\Plugins\NodesViewer.dll', `
            'Build\Plugins\SoundPropagationMode.dll', `
            'Build\Plugins\StairSectorBuilder.dll', `
            'Build\Plugins\TagExplorer.dll', `
            'Build\Plugins\TagRange.dll', `
            'Build\Plugins\ThreeDFloorMode.dll', `
            'Build\Plugins\VisplaneExplorer.dll', `
            'Build\Updater.exe' `
          )
          foreach($file in $files)
          {
            if (!(Test-Path -Path $file -PathType Leaf))
            {
              Write-Output "ERROR: File $file is missing"
              exit 1
            }
          }

      - name: Build Installer
        run: |
          $isccPath = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          
          if (-not (Test-Path $isccPath)) {
              $isccPath = "$env:ProgramFiles\Inno Setup 6\ISCC.exe"
          }

          if (-not (Test-Path $isccPath)) {
              throw "ISCC.exe not found!"
          }

          $outputFileName = "UltimateDoomBuilder-Setup-R${{ needs.get-revision.outputs.revision }}-${{ matrix.platform }}"

          & $isccPath /DUDB_arch=${{ matrix.platform }} "Setup\UDBuilder_setup.iss" "-f$outputFileName" "/ORelease"
          if (-not $?) { throw "Building installer failed" }

      - name: Install 7-Zip
        run: choco install 7zip -y

      - name: Zip files
        run: |
          $outputFileName = "UltimateDoomBuilder-R${{ needs.get-revision.outputs.revision }}-${{ matrix.platform }}.7z"
          & 7z a Release\$outputFileName .\Build\* "-xr!*.xml" "-x!.gitignore"
          if (-not $?) { throw "Zipping files failed" }

      - name: Upload Installer
        uses: actions/upload-artifact@v7
        with:
          path: Release/UltimateDoomBuilder-Setup-R${{ needs.get-revision.outputs.revision }}-${{ matrix.platform }}.exe
          archive: false
          if-no-files-found: error
          retention-days: 1

      - name: Upload 7-Zip file
        uses: actions/upload-artifact@v7
        with:
          path: Release/UltimateDoomBuilder-R${{ needs.get-revision.outputs.revision }}-${{ matrix.platform }}.7z
          archive: false
          if-no-files-found: error
          retention-days: 1

  create-release:
    name: Create GitHub Release
    needs: [build-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download Artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./artifacts

      - name: "Create Release R${{ needs.get-revision.outputs.revision }}"
        uses: softprops/action-gh-release@v3
        with:
          body: "Automated builds for Ultimate Doom Builder R${{ needs.get-revision.outputs.revision }}."
          files: ./artifacts/*
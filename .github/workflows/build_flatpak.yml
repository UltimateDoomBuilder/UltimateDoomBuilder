name: Build Flatpak

on:
  workflow_call:
    inputs:
      revision:
        required: true
        type: string

jobs:
  build-flatpak:
    name: "Build Flatpak"
    runs-on: ubuntu-latest
    permissions:
      contents: write
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:freedesktop-24.08
      options: --privileged

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 0 # Required to properly get the commit count

      - name: Git setup
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Build Flatpak
        uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          bundle: ultimatedoombuilder-R${{ inputs.revision }}.flatpak
          manifest-path: flatpak/io.github.ultimatedoombuilder.ultimatedoombuilder.yml
          run-tests: false
          cache: true
          restore-cache: true
          cache-key: flatpak-builder-${{ hashFiles('flatpak/io.github.ultimatedoombuilder.ultimatedoombuilder.yml') }}
          upload-artifact: false

      - name: Upload FlatpakArtifact
        uses: actions/upload-artifact@v7
        with:
          path: ultimatedoombuilder-R${{ inputs.revision }}.flatpak
          if-no-files-found: error
          archive: false
          retention-days: 1

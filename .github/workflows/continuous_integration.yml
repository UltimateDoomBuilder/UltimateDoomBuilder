name: Build And Create Release

on: [push, pull_request, workflow_dispatch]

jobs:
  get-revision:
    name: Prepare Build
    runs-on: ubuntu-latest
    outputs:
      revision: ${{ steps.vars.outputs.REV_COUNT }}
      xml_changelog: ${{ steps.vars.outputs.XML_CHANGELOG }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 0 # Required to properly get the commit count      
      
      - name: Determine Revision
        id: vars
        run: |
          COUNT=$(git rev-list --count HEAD)
          echo "REV_COUNT=$COUNT" >> $GITHUB_OUTPUT
          echo "Detected Revision: $COUNT"  

      - name: Generate XML Changelog
        run: |
          XML_CHANGELOG=$(
            echo '<?xml version="1.0" encoding="UTF-8"?>'
            echo '<log>'
            git log master --since=2012-04-17 --pretty=format:"  [OB]logentry commit=\"%h\"[CB]%n    [OB]author[CB]%an[OB]/author[CB]%n    [OB]date[CB]%aI[OB]/date[CB]%n    [OB]msg[CB]%B[OB]/msg[CB]%n  [OB]/logentry[CB]" | sed -e 's/</\&lt;/g' -e 's/>/\&gt;/g' -e 's/\[OB\]/</g' -e 's/\[CB\]/>/g'
            echo '</log>'
          )
          echo "$XML_CHANGELOG"
          echo "XML_CHANGELOG='$XML_CHANGELOG'" >> $GITHUB_OUTPUT


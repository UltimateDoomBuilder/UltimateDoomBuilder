name: Build And Create Release

on: [push, pull_request, workflow_dispatch]

jobs:
  get-revision:
    name: Prepare Build
    runs-on: ubuntu-latest
    outputs:
      revision: ${{ steps.vars.outputs.REV_COUNT }}
      text_changelog: ${{ steps.vars.outputs.TEXT_CHANGELOG }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 0 # Required to properly get the commit count      
      
      - name: Determine Revision
        id: vars
        run: |
          COUNT=$(git rev-list --count HEAD)
          echo "REV_COUNT=$COUNT" >> $GITHUB_OUTPUT
          echo "Detected Revision: $COUNT"  

      - name: Set Up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      
      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install GitPython

      - name: Generate Text Changelog
        run: |
          TEXT_CHANGELOG=$(python generate-changelog.py --branch origin/master --format text)
          {
            echo "TEXT_CHANGELOG<<EOF"
            echo "$TEXT_CHANGELOG"
            echo "EOF"
          } >> $GITHUB_OUTPUT

